; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
extra_scripts = pre:configure_console.py
build_flags =
  -D CONSOLE_USE_USB_SERIAL=1
  -Os
  -flto
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -Wl,-Map=.pio/build/bluepill_f103c8/firmware.map
lib_deps =
  Spacehuhn/SimpleCLI
upload_flags =
  -c
  set CPUTAPID 0x1ba01477

monitor_filters = send_on_enterfs

[env:bluepill_f103c8_uart]
extends = env:bluepill_f103c8
build_unflags =
  -D CONSOLE_USE_USB_SERIAL=1
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USBCON
  -D USBD_USE_CDC
  -D HAL_PCD_MODULE_ENABLED
build_flags =
  ${env:bluepill_f103c8.build_flags}
  -D CONSOLE_USE_USB_SERIAL=0
