<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     width="20mm" 
     height="40mm" 
     viewBox="0 0 20 40">
  
  <title>Test Printing Pattern - Lines and Circles</title>
  <desc>2x4 cm test pattern with lines (1mm to 0.05mm) and concentric circles</desc>
  
  <!-- Background -->
  <rect x="0" y="0" width="20" height="40" fill="#ffffff" stroke="#000000" stroke-width="0.1"/>
  
  <!-- SECTION 1: Horizontal Lines of Different Thicknesses -->
  <g id="horizontal-lines">
    <!-- 1.0mm line -->
    <line x1="1" y1="2" x2="19" y2="2" stroke="#E63946" stroke-width="1.0"/>
    <text x="0.5" y="2.3" font-size="1" fill="#333">1.0</text>
    
    <!-- 0.8mm line -->
    <line x1="1" y1="4" x2="19" y2="4" stroke="#F4A261" stroke-width="0.8"/>
    <text x="0.5" y="4.3" font-size="1" fill="#333">0.8</text>
    
    <!-- 0.6mm line -->
    <line x1="1" y1="5.8" x2="19" y2="5.8" stroke="#E9C46A" stroke-width="0.6"/>
    <text x="0.5" y="6.1" font-size="1" fill="#333">0.6</text>
    
    <!-- 0.5mm line -->
    <line x1="1" y1="7.4" x2="19" y2="7.4" stroke="#2A9D8F" stroke-width="0.5"/>
    <text x="0.5" y="7.7" font-size="1" fill="#333">0.5</text>
    
    <!-- 0.4mm line -->
    <line x1="1" y1="8.8" x2="19" y2="8.8" stroke="#264653" stroke-width="0.4"/>
    <text x="0.5" y="9.1" font-size="1" fill="#333">0.4</text>
    
    <!-- 0.3mm line -->
    <line x1="1" y1="10" x2="19" y2="10" stroke="#7209B7" stroke-width="0.3"/>
    <text x="0.5" y="10.3" font-size="1" fill="#333">0.3</text>
    
    <!-- 0.25mm line -->
    <line x1="1" y1="11" x2="19" y2="11" stroke="#3A0CA3" stroke-width="0.25"/>
    <text x="0.5" y="11.3" font-size="1" fill="#333">0.25</text>
    
    <!-- 0.2mm line -->
    <line x1="1" y1="11.9" x2="19" y2="11.9" stroke="#4361EE" stroke-width="0.2"/>
    <text x="0.5" y="12.2" font-size="1" fill="#333">0.2</text>
    
    <!-- 0.15mm line -->
    <line x1="1" y1="12.7" x2="19" y2="12.7" stroke="#4CC9F0" stroke-width="0.15"/>
    <text x="0.5" y="13" font-size="1" fill="#333">0.15</text>
    
    <!-- 0.1mm line -->
    <line x1="1" y1="13.4" x2="19" y2="13.4" stroke="#06D6A0" stroke-width="0.1"/>
    <text x="0.5" y="13.7" font-size="1" fill="#333">0.1</text>
    
    <!-- 0.08mm line -->
    <line x1="1" y1="14" x2="19" y2="14" stroke="#FF006E" stroke-width="0.08"/>
    <text x="0.5" y="14.3" font-size="1" fill="#333">0.08</text>
    
    <!-- 0.05mm line -->
    <line x1="1" y1="14.5" x2="19" y2="14.5" stroke="#FB5607" stroke-width="0.05"/>
    <text x="0.5" y="14.8" font-size="1" fill="#333">0.05</text>
  </g>
  
  <!-- SECTION 2: Concentric Circles with Different Thicknesses -->
  <g id="concentric-circles" transform="translate(10, 27)">
    <!-- Largest circle - 1.0mm -->
    <circle cx="0" cy="0" r="9" fill="none" stroke="#E63946" stroke-width="1.0"/>
    
    <!-- 0.8mm -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#F4A261" stroke-width="0.8"/>
    
    <!-- 0.6mm -->
    <circle cx="0" cy="0" r="7" fill="none" stroke="#E9C46A" stroke-width="0.6"/>
    
    <!-- 0.5mm -->
    <circle cx="0" cy="0" r="6" fill="none" stroke="#2A9D8F" stroke-width="0.5"/>
    
    <!-- 0.4mm -->
    <circle cx="0" cy="0" r="5" fill="none" stroke="#264653" stroke-width="0.4"/>
    
    <!-- 0.3mm -->
    <circle cx="0" cy="0" r="4" fill="none" stroke="#7209B7" stroke-width="0.3"/>
    
    <!-- 0.25mm -->
    <circle cx="0" cy="0" r="3.2" fill="none" stroke="#3A0CA3" stroke-width="0.25"/>
    
    <!-- 0.2mm -->
    <circle cx="0" cy="0" r="2.5" fill="none" stroke="#4361EE" stroke-width="0.2"/>
    
    <!-- 0.15mm -->
    <circle cx="0" cy="0" r="1.9" fill="none" stroke="#4CC9F0" stroke-width="0.15"/>
    
    <!-- 0.1mm -->
    <circle cx="0" cy="0" r="1.4" fill="none" stroke="#06D6A0" stroke-width="0.1"/>
    
    <!-- 0.08mm -->
    <circle cx="0" cy="0" r="1" fill="none" stroke="#FF006E" stroke-width="0.08"/>
    
    <!-- 0.05mm - smallest -->
    <circle cx="0" cy="0" r="0.6" fill="none" stroke="#FB5607" stroke-width="0.05"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="0.2" fill="#000000"/>
  </g>
  
  <!-- Labels -->
  <text x="10" y="16.5" font-size="1.2" fill="#333" text-anchor="middle" font-weight="bold">Line Test (mm)</text>
  <text x="10" y="38.5" font-size="0.8" fill="#666" text-anchor="middle">Circle thicknesses: 1.0 → 0.05 mm</text>
  
</svg>
